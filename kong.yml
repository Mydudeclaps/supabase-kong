_format_version: '2.1'
_transform: true

###
### Consumers / Users
###
consumers:
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY

###
### Access Control List
###
acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin

###
### API Routes
###
services:
  ## Open Auth routes
  - name: auth-v1-open
    url: http://$AUTH_HOST:9999/verify
    routes:
      - name: auth-v1-open
        strip_path: true
        paths:
          - /auth/v1/verify
    plugins:
      - name: cors
  - name: auth-v1-open-callback
    url: http://$AUTH_HOST:9999/callback
    routes:
      - name: auth-v1-open-callback
        strip_path: true
        paths:
          - /auth/v1/callback
    plugins:
      - name: cors
  - name: auth-v1-open-authorize
    url: http://$AUTH_HOST:9999/authorize
    routes:
      - name: auth-v1-open-authorize
        strip_path: true
        paths:
          - /auth/v1/authorize
    plugins:
      - name: cors

  ## Open OAuth 2.1 server routes (GoTrue as the authorization server for the hosted
  ## staff MCP). AI clients (Claude, ChatGPT, Codex) call these without an apikey.
  ## Exact-match regexes, so /auth/v1/oauth/authorizations/* (consent, needs the
  ## user's JWT) and /auth/v1/oauth/grants stay behind key-auth below.
  - name: auth-v1-open-oauth-authorize
    url: http://$AUTH_HOST:9999/oauth/authorize
    routes:
      - name: auth-v1-open-oauth-authorize
        strip_path: true
        paths:
          - /auth/v1/oauth/authorize$
    plugins:
      - name: cors
      - name: pre-function
        # OAuth authorize guard (t-6cd5df). Allowlist must match the app consent page and
        # staff_mcp_oauth_redirect_host; change all three together. No dollar signs: envsubst.
        config: &oauth_authorize_guard
          access:
            - |
              -- OAuth authorize guard (t-6cd5df). Kong 2.8.1 pre-function, access phase, untrusted_lua=sandbox.
              -- No dollar signs anywhere: the image runs envsubst over kong.yml before Kong starts.
              local ALLOWED = {
                ["https://claude.ai/api/mcp/auth_callback"] = true,
                ["https://claude.com/api/mcp/auth_callback"] = true,
                ["https://chatgpt.com/connector_platform_oauth_redirect"] = true,
              }
              local function loopback(u)
                local rest = u:match("^http://localhost(.*)") or u:match("^http://127%.0%.0%.1(.*)")
                if not rest then return false end
                if rest:sub(1, 1) == ":" then
                  local port = rest:match("^:(%d+)")
                  if not port or #port > 5 then return false end
                  rest = rest:sub(#port + 2)
                end
                return rest == "" or (rest:sub(1, 1) == "/" and not rest:find("[?#]"))
              end
              local function refuse(msg)
                return kong.response.exit(400, { error = "invalid_request", error_description = msg })
              end
              local path = kong.request.get_path():lower()
                :gsub("%%(%x%x)", function(h) return string.char(tonumber(h, 16)) end)
                :gsub("/+", "/")
              if path:sub(-1) == "/" then path = path:sub(1, -2) end
              if path ~= "/auth/v1/oauth/authorize" then return end
              local q = kong.request.get_query(100)
              local r, m, c = q.redirect_uri, q.code_challenge_method, q.code_challenge
              if type(r) ~= "string" or not (ALLOWED[r] or loopback(r)) then
                return refuse("redirect_uri is not an allowed callback")
              end
              if m ~= "S256" or type(c) ~= "string" or c == "" then
                return refuse("PKCE with code_challenge_method=S256 is required")
              end
  - name: auth-v1-open-oauth-token
    url: http://$AUTH_HOST:9999/oauth/token
    routes:
      - name: auth-v1-open-oauth-token
        strip_path: true
        paths:
          - /auth/v1/oauth/token$
    plugins:
      - name: cors
  - name: auth-v1-open-oauth-register
    url: http://$AUTH_HOST:9999/oauth/clients/register
    routes:
      - name: auth-v1-open-oauth-register
        strip_path: true
        paths:
          - /auth/v1/oauth/clients/register$
    plugins:
      - name: cors
  - name: auth-v1-open-well-known
    url: http://$AUTH_HOST:9999/.well-known/
    routes:
      - name: auth-v1-open-well-known
        strip_path: true
        paths:
          - /auth/v1/.well-known/
    plugins:
      - name: cors
  ## RFC 8414 / OIDC path-inserted discovery for the issuer <origin>/auth/v1
  - name: well-known-oauth-as-auth-v1
    url: http://$AUTH_HOST:9999/.well-known/oauth-authorization-server
    routes:
      - name: well-known-oauth-as-auth-v1
        strip_path: true
        paths:
          - /.well-known/oauth-authorization-server/auth/v1$
    plugins:
      - name: cors
  - name: well-known-openid-auth-v1
    url: http://$AUTH_HOST:9999/.well-known/openid-configuration
    routes:
      - name: well-known-openid-auth-v1
        strip_path: true
        paths:
          - /.well-known/openid-configuration/auth/v1$
    plugins:
      - name: cors

  ## Secure Auth routes
  - name: auth-v1
    _comment: 'GoTrue: /auth/v1/* -> http://auth:9999/*'
    url: http://$AUTH_HOST:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/
    plugins:
      - name: cors
      - name: pre-function
        # Same guard on the key-auth catch-all, for path variants that miss the exact route.
        config: *oauth_authorize_guard
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## Secure REST routes
  - name: rest-v1
    _comment: 'PostgREST: /rest/v1/* -> http://rest:3000/*'
    url: http://$REST_HOST:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## Secure GraphQL routes
  - name: graphql-v1
    _comment: 'PostgREST: /graphql/v1/* -> http://rest:3000/rpc/graphql'
    url: http://$REST_HOST:3000/rpc/graphql
    routes:
      - name: graphql-v1-all
        strip_path: true
        paths:
          - /graphql/v1
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: true
      - name: request-transformer
        config:
          add:
            headers:
              - Content-Profile:graphql_public
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon

  ## Secure Realtime routes
  - name: realtime-v1-ws
    _comment: 'Realtime: /realtime/v1/* -> ws://realtime:4000/socket/*'
    url: http://$REALTIME_HOST:4000/socket
    protocol: ws
    routes:
      - name: realtime-v1-ws
        strip_path: true
        paths:
          - /realtime/v1/
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
  - name: realtime-v1-rest
    _comment: 'Realtime: /realtime/v1/* -> ws://realtime:4000/socket/*'
    url: http://$REALTIME_HOST:4000/api
    protocol: http
    routes:
      - name: realtime-v1-rest
        strip_path: true
        paths:
          - /realtime/v1/api
    plugins:
      - name: cors
      - name: key-auth
        config:
          hide_credentials: false
      - name: acl
        config:
          hide_groups_header: true
          allow:
            - admin
            - anon
